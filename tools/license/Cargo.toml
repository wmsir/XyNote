[package]
name = "xynote-license"
version = "0.1.0"
edition = "2021"
description = "小悦笔记永久版授权码生成工具（仅发码方使用）"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
