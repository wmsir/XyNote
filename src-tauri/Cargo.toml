[package]
name = "xynote"
version = "0.8.6"
description = "小悦 · 轻量知识笔记 (XyNote) — 悦享服务、愉悦记录，块级结构与多维表格桌面端 (https://fwpt.cn/)"
authors = ["fwpt.cn <admin@fwpt.cn>"]
edition = "2021"

[lib]
name = "xynote_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
trash = "5"
# 同步：内容哈希、端到端加密（AES-256-GCM，密钥由 Argon2id 从同步密码派生）
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
# 永久版授权：Ed25519 离线校验
ed25519-dalek = "2"
# 导出 HTML / Word
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
# 文本编辑器：GBK / UTF-16 等编码读写
encoding_rs = "0.8"

[target.'cfg(not(target_os = "windows"))'.dependencies]
rfd = "0.15"

[patch.crates-io]
webview2-com-sys = { path = "vendor/webview2-com-sys" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true
