name: claude-preview
on:
  push:
    branches: [claude/xynote-preview]
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.txt
        continue-on-error: true
      - run: npx vite build --base ./
      - run: |
          cp /tmp/tsc.txt dist/_tsc.txt
          node -e "const m=require('lucide-react');console.log(Object.keys(m.icons).join('\\n'))" > dist/_icons.txt || true
          cd dist && git init -q && git checkout -q -b claude/xynote-preview-dist && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm dist
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" claude/xynote-preview-dist
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: mkdir -p dist && echo '<html></html>' > dist/index.html
      - name: license tool
        run: |
          cargo test --manifest-path tools/license/Cargo.toml && cargo build --manifest-path tools/license/Cargo.toml
          cd /tmp && $GITHUB_WORKSPACE/tools/license/target/debug/xynote-license keygen --out t.key && $GITHUB_WORKSPACE/tools/license/target/debug/xynote-license issue --key t.key --name ci --count 2
      - name: verify real pubkey interop
        run: tools/license/target/debug/xynote-license verify --pubkey-file src-tauri/license_pubkey.txt --license 'XYNOTE1.eyJ2IjoxLCJpZCI6IkwtQ0ktRVhQSVJFRCIsIm5hbWUiOiJDSSIsImVkaXRpb24iOiJ0cmlhbCIsImlzc3VlZEF0IjoiMjAyMC0wMS0wMVQwMDowMDowMCswMDowMCIsImV4cGlyZXNBdCI6IjIwMjAtMDEtMDJUMDA6MDA6MDArMDA6MDAifQ.EuzUZHHPa4-SmWvQeFuo_BrVuMGVpdt3zD1MXd0HMpLMhR7ZqXjNdq9mY85JMuvQYc_E0FttbJU5EjaUy-moBQ'
      - name: server tests
        run: cargo test --manifest-path server/Cargo.toml 2>&1 | tail -40
        shell: bash -o pipefail {0}
      - name: start server
        run: |
          cargo build --manifest-path server/Cargo.toml
          XYNOTE_DATA_DIR=/tmp/xysrv XYNOTE_BIND=127.0.0.1:8787 nohup server/target/debug/xynote-sync-server > /tmp/srv.log 2>&1 &
          sleep 2; curl -sf http://127.0.0.1:8787/healthz
      - name: client tests (with e2e)
        run: XYNOTE_EXPORT_SAMPLE_DIR=/tmp/samples XYNOTE_TEST_SERVER_URL=http://127.0.0.1:8787 cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tail -80
        shell: bash -o pipefail {0}
      - if: always()
        run: |
          mkdir /tmp/lock && cp /tmp/samples/* /tmp/lock/ 2>/dev/null; cp src-tauri/Cargo.lock /tmp/lock/ && cp server/Cargo.lock /tmp/lock/server.Cargo.lock 2>/dev/null; cp tools/license/Cargo.lock /tmp/lock/license.Cargo.lock 2>/dev/null; cd /tmp/lock && git init -q && git checkout -q -b claude/xynote-preview-lock && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm lock
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" claude/xynote-preview-lock
