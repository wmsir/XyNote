name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  rust:
    name: Rust 测试 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      # tauri 的构建脚本要求前端产物目录存在；测试不需要真实页面
      - name: 占位前端产物
        shell: bash
        run: mkdir -p dist && echo '<html></html>' > dist/index.html
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  server:
    name: 同步服务器、授权码工具与端到端同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            src-tauri -> target
            tools/license -> target
      - run: mkdir -p dist && echo '<html></html>' > dist/index.html
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - name: 永久版授权码工具
        run: |
          cargo test --locked --manifest-path tools/license/Cargo.toml
          cargo build --locked --manifest-path tools/license/Cargo.toml
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/tools/license/target/debug/xynote-license" keygen --out t.key && "$GITHUB_WORKSPACE/tools/license/target/debug/xynote-license" issue --key t.key --name ci
      - name: 启动同步服务器
        run: |
          cargo build --locked --manifest-path server/Cargo.toml
          XYNOTE_DATA_DIR=/tmp/xysrv XYNOTE_BIND=127.0.0.1:8787 nohup server/target/debug/xynote-sync-server > /tmp/srv.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8787/healthz && break; sleep 1; done
      - name: 客户端与服务器端到端同步
        run: XYNOTE_TEST_SERVER_URL=http://127.0.0.1:8787 cargo test --locked --manifest-path src-tauri/Cargo.toml server_remote_end_to_end
