name: Build & Release XyNote (Windows + macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        id: version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Prepare portable Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/XyNote.exe" "dist-release/XyNote-${{ steps.version.outputs.app_version }}.exe"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" "dist-release/"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" "dist-release/"

      - name: Collect macOS bundles
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist-release/ || true
          for dmg in dist-release/*.dmg; do
            [ -e "$dmg" ] || continue
            base=$(basename "$dmg" .dmg)
            mv "$dmg" "dist-release/${base}-${{ matrix.label }}.dmg"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XyNote-${{ steps.version.outputs.app_version }}-${{ matrix.label }}
          path: dist-release/*

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
