name: Build & Release XyNote

# 每次向 main 推送代码更新时自动检查版本并打包发布：
# - 若当前版本号尚未发布，按当前版本号打包发布 Release；
# - 若当前版本号已发布，自动递增补丁位（如 0.7.2 -> 0.7.3）并回写版本号后再打包发布。
# - 支持推送 v* 标签或 workflow_dispatch 手动触发。
#
# 可选的仓库 Secrets：
#   XYNOTE_LICENSE_PUBKEY  永久版授权公钥（不设置时使用 src-tauri/license_pubkey.txt）

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  XYNOTE_LICENSE_PUBKEY: ${{ secrets.XYNOTE_LICENSE_PUBKEY }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查版本并自动递增（如需要）
        id: v
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            LAST_MSG=$(git log -1 --pretty=%B)
            if [[ "$LAST_MSG" == chore\(release\):* || "$LAST_MSG" == *"[skip release]"* ]]; then
              echo "检测到自动升版提交，跳过重复发布"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          VERSION=$(node -p "require('./package.json').version")

          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::标签 ${GITHUB_REF#refs/tags/} 与 package.json 版本 $VERSION 不一致"
            exit 1
          fi

          if [[ "$GITHUB_REF" == "refs/heads/main" ]] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION 已发布，自动递增补丁版本号..."
            while gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
              IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
              VERSION="${MAJ}.${MIN}.$((PAT + 1))"
            done
            echo "新版本号：$VERSION"
            NEW_VER="$VERSION" node -e '
              const fs = require("fs");
              const v = process.env.NEW_VER;
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              pkg.version = v;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
              const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              lock.version = v;
              if (lock.packages && lock.packages[""]) lock.packages[""].version = v;
              fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            '
            python3 - "$VERSION" <<'PY'
          import re, sys
          ver = sys.argv[1]
          for path, pat, repl in [
              ("src-tauri/Cargo.toml", r'(?m)^(version\s*=\s*")[^"]+(")', rf'\g<1>{ver}\g<2>'),
              ("src-tauri/Cargo.lock", r'(?ms)(name\s*=\s*"xynote"\s+version\s*=\s*")[^"]+(")', rf'\g<1>{ver}\g<2>'),
          ]:
              txt = open(path, "r", encoding="utf-8").read()
              new_txt, n = re.subn(pat, repl, txt, count=1)
              assert n == 1, f"Failed updating version in {path}"
              open(path, "w", encoding="utf-8", newline="\n").write(new_txt)
          PY
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore(release): v$VERSION [skip release] [skip ci]"
            git push origin HEAD:main
          fi

          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::src-tauri/Cargo.toml 版本 $CARGO_VERSION 与 package.json 版本 $VERSION 不一致"
            exit 1
          fi
          if ! grep -qE '^[0-9a-fA-F]{64}$' src-tauri/license_pubkey.txt && [[ -z "$XYNOTE_LICENSE_PUBKEY" ]]; then
            echo "::warning::未配置永久版授权公钥：这个版本无法登录或激活永久版"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-app:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            macos_min: "11.0"
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            macos_min: "10.15"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.sha }}

      - name: 设置 macOS 最低部署目标版本
        if: startsWith(matrix.platform, 'macos') && matrix.macos_min != ''
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_min }}" >> "$GITHUB_ENV"

      - name: 安装 Linux 依赖
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 脱敏编译路径 (Unix/macOS)
        if: "!startsWith(matrix.platform, 'windows')"
        shell: bash
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_DIR="${RUSTUP_HOME:-$HOME/.rustup}"
          FLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/app"$'\x1f'"--remap-path-prefix=${CARGO_DIR}=/deps"$'\x1f'"--remap-path-prefix=${RUSTUP_DIR}=/rust"
          echo "CARGO_ENCODED_RUSTFLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: 脱敏编译路径 (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $sep = [char]0x1f
          $cargoDir = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME ".cargo" }
          $rustupDir = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $HOME ".rustup" }
          $flags = @(
            "--remap-path-prefix=$($env:GITHUB_WORKSPACE)=/app",
            "--remap-path-prefix=$cargoDir=/deps",
            "--remap-path-prefix=$rustupDir=/rust"
          ) -join $sep
          "CARGO_ENCODED_RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}-${{ matrix.macos_min }}

      - run: npm ci

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: 收集 Windows 安装包与便携版
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $dir = "src-tauri/target/${{ matrix.target }}/release"
          Copy-Item "$dir/XyNote.exe" "dist-release/XyNote-$env:VERSION-windows-x64-portable.exe"
          Copy-Item "$dir/bundle/nsis/*.exe" "dist-release/"
          Copy-Item "$dir/bundle/msi/*.msi" "dist-release/"

      - name: 收集 macOS 安装包
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          mkdir -p dist-release
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            [ -e "$dmg" ] || continue
            cp "$dmg" "dist-release/$(basename "$dmg" .dmg)-${{ matrix.label }}.dmg"
          done

      - name: 收集 Linux 安装包
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist-release/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb dist-release/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm dist-release/ 2>/dev/null || true
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: XyNote-${{ env.VERSION }}-${{ matrix.label }}
          path: dist-release/*

  build-server:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: 脱敏编译路径
        shell: bash
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_DIR="${RUSTUP_HOME:-$HOME/.rustup}"
          FLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=/app"$'\x1f'"--remap-path-prefix=${CARGO_DIR}=/deps"$'\x1f'"--remap-path-prefix=${RUSTUP_DIR}=/rust"
          echo "CARGO_ENCODED_RUSTFLAGS=$FLAGS" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"
      - name: 编译同步服务器
        run: cargo build --release --locked --manifest-path server/Cargo.toml
      - name: 打包
        run: |
          mkdir -p pkg/xynote-sync-server dist-release
          cp server/target/release/xynote-sync-server server/README.md server/Dockerfile pkg/xynote-sync-server/
          tar -C pkg -czf "dist-release/xynote-sync-server-$VERSION-linux-x64.tar.gz" xynote-sync-server
      - uses: actions/upload-artifact@v4
        with:
          name: xynote-sync-server-${{ env.VERSION }}-linux-x64
          path: dist-release/*

  build-harmony:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: 构建前端并同步至鸿蒙 PC 原生工程
        run: |
          npm run build:harmony
          mkdir -p dist-release
          zip -r "dist-release/XyNote-$VERSION-harmonyos-pc-project.zip" harmony-pc
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: XyNote-${{ env.VERSION }}-harmonyos-pc
          path: dist-release/*

  publish:
    if: needs.check-version.outputs.publish == 'true'
    needs: [check-version, build-app, build-server, build-harmony]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
      TARGET_SHA: ${{ needs.check-version.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ env.TARGET_SHA }}
          name: 小悦笔记 XyNote v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 |
            |---|---|
            | Windows | `*_x64-setup.exe`（推荐）、`*.msi`，或免安装的 `*-portable.exe` |
            | macOS（Apple 芯片） | `*-macos-arm64.dmg` |
            | macOS（Intel） | `*-macos-x64.dmg` |
            | Linux x86_64（银河麒麟 / 统信 UOS / Ubuntu / Debian / Fedora / openEuler） | `*_amd64.deb`、`*.x86_64.rpm`、`*_amd64.AppImage` |
            | Linux ARM64（银河麒麟 V10 飞腾 / 鲲鹏 / ARM64 发行版） | `*_arm64.deb`、`*.aarch64.rpm`、`*_aarch64.AppImage` |
            | 鸿蒙 PC（HarmonyOS 5 / API 12+ 2in1） | `*-harmonyos-pc-project.zip`（含已构建前端与 ArkTS/ArkWeb 原生工程，DevEco Studio 一键编译 `.hap`） |
            | 同步服务器（自建） | `xynote-sync-server-*-linux-x64.tar.gz`，部署说明见其中的 README |

            安装包未做代码签名：Windows 若提示「已保护你的电脑」，点「更多信息 → 仍要运行」；macOS 首次打开请在「系统设置 → 隐私与安全性」中允许。

            全部功能免费，无广告、无需登录；社区主题、CSS 插件与最新国内镜像下载详见 https://fwpt.cn/xynote/
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
