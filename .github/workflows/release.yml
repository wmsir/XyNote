name: Build & Release XyNote

# 自动发布：main 分支上的版本号（package.json）还没有发布过时，自动打包并创建
# v<版本号> 标签与 GitHub Release。所以发新版只需要把版本号改大并合并到 main。
# 也支持推送 v* 标签，或在 Actions 页手动运行（版本已发布过时只生成构建产物）。
#
# 可选的仓库 Secrets：
#   XYNOTE_LICENSE_PUBKEY  永久版授权公钥（不设置时使用 src-tauri/license_pubkey.txt）

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  XYNOTE_LICENSE_PUBKEY: ${{ secrets.XYNOTE_LICENSE_PUBKEY }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查标签与版本号一致
        id: v
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::标签 ${GITHUB_REF#refs/tags/} 与 package.json 版本 $VERSION 不一致"
            exit 1
          fi
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::src-tauri/Cargo.toml 版本 $CARGO_VERSION 与 package.json 版本 $VERSION 不一致"
            exit 1
          fi
          if ! grep -qE '^[0-9a-fA-F]{64}$' src-tauri/license_pubkey.txt && [[ -z "$XYNOTE_LICENSE_PUBKEY" ]]; then
            echo "::warning::未配置永久版授权公钥：这个版本无法登录或激活永久版"
          fi
          # 该版本还没有发布过才发布（标签推送总是发布）
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH=true
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION 已发布，本次只构建"
            PUBLISH=false
          else
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-app:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: 收集 Windows 安装包与便携版
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $dir = "src-tauri/target/${{ matrix.target }}/release"
          Copy-Item "$dir/XyNote.exe" "dist-release/XyNote-$env:VERSION-windows-x64-portable.exe"
          Copy-Item "$dir/bundle/nsis/*.exe" "dist-release/"
          Copy-Item "$dir/bundle/msi/*.msi" "dist-release/"

      - name: 收集 macOS 安装包
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          mkdir -p dist-release
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            [ -e "$dmg" ] || continue
            cp "$dmg" "dist-release/$(basename "$dmg" .dmg)-${{ matrix.label }}.dmg"
          done

      - name: 收集 Linux 安装包
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist-release/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb dist-release/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm dist-release/ 2>/dev/null || true
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: XyNote-${{ env.VERSION }}-${{ matrix.label }}
          path: dist-release/*

  build-server:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"
      - name: 编译同步服务器
        run: cargo build --release --locked --manifest-path server/Cargo.toml
      - name: 打包
        run: |
          mkdir -p pkg/xynote-sync-server dist-release
          cp server/target/release/xynote-sync-server server/README.md server/Dockerfile pkg/xynote-sync-server/
          tar -C pkg -czf "dist-release/xynote-sync-server-$VERSION-linux-x64.tar.gz" xynote-sync-server
      - uses: actions/upload-artifact@v4
        with:
          name: xynote-sync-server-${{ env.VERSION }}-linux-x64
          path: dist-release/*

  publish:
    if: needs.check-version.outputs.publish == 'true'
    needs: [check-version, build-app, build-server]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: 小悦笔记 XyNote v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 |
            |---|---|
            | Windows | `*_x64-setup.exe`（推荐）、`*.msi`，或免安装的 `*-portable.exe` |
            | macOS（Apple 芯片） | `*-macos-arm64.dmg` |
            | macOS（Intel） | `*-macos-x64.dmg` |
            | Linux | `*.AppImage`、`*.deb`、`*.rpm` |
            | 同步服务器（自建） | `xynote-sync-server-*-linux-x64.tar.gz`，部署说明见其中的 README |

            安装包未做代码签名：Windows 若提示「已保护你的电脑」，点「更多信息 → 仍要运行」；macOS 首次打开请在「系统设置 → 隐私与安全性」中允许。

            基础功能免费；在「设置 → 永久版」登录 FWPT 通行证可免费使用永久版一年，之后 ¥9.9 一次购买。详见 https://fwpt.cn/xynote.html
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
